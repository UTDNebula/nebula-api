# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:

  build_ubuntu:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
    
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'
        cache-dependency-path: "**/go.sum"

    - name: Setup
      run: make setup

    - name: Check
      run: make check

    # Forked pull requests cannot access the upstream repository's MongoDB secret.
    # Keep running database-independent tests, while making the coverage limitation explicit.
    - name: Test (database-independent)
      if: ${{ env.MONGODB_URI == '' }}
      run: go test ./rest/configs ./rest/schema -count=1

    - name: Test (full suite)
      if: ${{ env.MONGODB_URI != '' }}
      run: make test

    - name: Build
      run: make build

  build_windows:
    runs-on: windows-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
    steps:
    
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'
        cache-dependency-path: "**\\go.sum"

    - name: Setup
      run: .\build.bat setup

    - name: Docs
      run: .\build.bat docs

    - name: Check
      run: .\build.bat checks

    - name: Test (database-independent)
      if: ${{ env.MONGODB_URI == '' }}
      run: go test ./rest/configs ./rest/schema -count=1

    - name: Test (full suite)
      if: ${{ env.MONGODB_URI != '' }}
      run: .\build.bat test

    - name: Build
      run: .\build.bat build

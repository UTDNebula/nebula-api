# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "graphql-v2" ]
  pull_request:
    branches: [ "graphql-v2" ]
  workflow_dispatch:

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      graphql: ${{ steps.filter.outputs.graphql }}
      rest: ${{ steps.filter.outputs.rest }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect paths of changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: develop
          filters: |
            graphql:
              - 'graphql/**'
            rest:
              - 'rest/**'
            shared:
              - 'shared/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - 'build.bat'

  build_ubuntu:
    name: Build Ubuntu
    needs: detect_changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: "**/go.sum"

      - name: Setup
        run: make setup

      - name: Check
        run: make check

      - name: Test
        shell: bash
        run: |
          log_test() { printf '\033[34m%s\033[0m\n' "$1"; }
          log_warn() { printf '\033[33m%s\033[0m\n' "$1"; }

          if [[ "${{ needs.detect_changes.outputs.shared }}" == "true" ]]; then
            log_test "Testing all modules"
            make test
            exit 0
          fi

          if [[ "${{ needs.detect_changes.outputs.rest }}" == "true" ]]; then
            log_test "Testing the REST server"
            make test-rest
          fi
          if [[ "${{ needs.detect_changes.outputs.graphql }}" == "true" ]]; then
            log_test "Testing the GraphQL server"
            make test-graph
          fi

          if [[
            "${{ needs.detect_changes.outputs.rest }}" != "true" &&
            "${{ needs.detect_changes.outputs.graphql }}" != "true"
          ]]; then
            log_warn "Skipping tests"
          fi
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Build
        shell: bash
        run: |
          log_build() { printf '\033[35m%s\033[0m\n' "$1"; }
          log_warn() { printf '\033[33m%s\033[0m\n' "$1"; }

          if [[ "${{ needs.detect_changes.outputs.shared }}" == "true" ]]; then
            log_build "Building REST and GraphQL"
            make build
            exit 0
          fi

          if [[ "${{ needs.detect_changes.outputs.rest }}" == "true" ]]; then
            log_build "Building REST server"
            make build-rest
          fi
          if [[ "${{ needs.detect_changes.outputs.graphql }}" == "true" ]]; then
            log_build "Building GraphQL server"
            make build-graph
          fi

          if [[
            "${{ needs.detect_changes.outputs.rest }}" != "true" &&
            "${{ needs.detect_changes.outputs.graphql }}" != "true"
          ]]; then
            log_warn "Skipping builds"
          fi

  build_windows:
    name: Build Windows
    needs: detect_changes
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: "**\\go.sum"

      - name: Setup
        run: .\build.bat setup

      - name: Check
        run: .\build.bat checks

      - name: Test
        shell: pwsh
        run: |
          function Write-TestLog {
            param([string]$Message)
            Write-Host $Message -ForegroundColor Cyan
          }

          function Write-WarnLog {
            param([string]$Message)
            Write-Host $Message -ForegroundColor Yellow
          }

          if ("${{ needs.detect_changes.outputs.shared }}" -eq "true") {
            Write-TestLog "Testing all modules"
            .\build.bat test
            exit 0
          }

          if ("${{ needs.detect_changes.outputs.rest }}" -eq "true") {
            Write-TestLog "Testing the REST server"
            .\build.bat test-rest
          }
          if ("${{ needs.detect_changes.outputs.graphql }}" -eq "true") {
            Write-TestLog "Testing the GraphQL server"
            .\build.bat test-graph
          }

          if (
            "${{ needs.detect_changes.outputs.rest }}" -ne "true" -and
            "${{ needs.detect_changes.outputs.graphql }}" -ne "true"
          ) {
            Write-WarnLog "Skipping tests"
          }
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Build
        shell: pwsh
        run: |
          function Write-BuildLog {
            param([string]$Message)
            Write-Host $Message -ForegroundColor Magenta
          }

          function Write-WarnLog {
            param([string]$Message)
            Write-Host $Message -ForegroundColor Yellow
          }

          if ("${{ needs.detect_changes.outputs.shared }}" -eq "true") {
            Write-BuildLog "Building REST and GraphQL"
            .\build.bat build
            exit 0
          }

          if ("${{ needs.detect_changes.outputs.rest }}" -eq "true") {
            Write-BuildLog "Building REST server"
            .\build.bat build-rest
          }
          if ("${{ needs.detect_changes.outputs.graphql }}" -eq "true") {
            Write-BuildLog "Building GraphQL server"
            .\build.bat build-graph
          }

          if (
            "${{ needs.detect_changes.outputs.rest }}" -ne "true" -and
            "${{ needs.detect_changes.outputs.graphql }}" -ne "true"
          ) {
            Write-WarnLog "Skipping build"
          }
